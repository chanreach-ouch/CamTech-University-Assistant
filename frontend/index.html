<!DOCTYPE html>
<html>
<head>
    <title>CamTech University Assistant</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        #chat { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .user { color: blue; }
        .bot { color: green; }
        input[type="text"] { width: 80%; padding: 5px; }
    </style>
</head>
<body>
    <h1>CamTech University Assistant</h1>
    <div id="chat"></div>
    <input type="text" id="msg" placeholder="Ask a question..." onkeypress="if(event.key === 'Enter') send()">
    <button onclick="send()">Send</button>

    <script>
        const thread_id = "test-" + Math.random().toString(36).substring(7);
        const chat = document.getElementById('chat');
        const input = document.getElementById('msg');

        async function send() {
            const msg = input.value;
            if(!msg) return;
            
            chat.innerHTML += `<p class="user"><strong>You:</strong> ${msg}</p>`;
            input.value = '';
            
            try {
                const res = await fetch('http://localhost:8000/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({thread_id: thread_id, message: msg})
                });
                const data = await res.json();
                chat.innerHTML += `<p class="bot"><strong>Assistant:</strong> ${data.response}</p>`;
            } catch (e) {
                chat.innerHTML += `<p style="color:red">Error connecting to server.</p>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
